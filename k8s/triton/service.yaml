apiVersion: v1
kind: Service
metadata:
  name: fraud-detection-triton
  namespace: default
  labels:
    app: fraud-detection-triton
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
  - name: grpc
    port: 8001
    targetPort: 8001
    protocol: TCP
  - name: metrics
    port: 8002
    targetPort: 8002
    protocol: TCP
  selector:
    app: fraud-detection-triton
