apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fraud-detection-triton-monitor
  namespace: default
  labels:
    release: prometheus
    app: fraud-detection-triton
spec:
  selector:
    matchLabels:
      app: fraud-detection-triton
  endpoints:
  - port: metrics
    path: /v2/metrics
    interval: 15s
    scrapeTimeout: 10s
