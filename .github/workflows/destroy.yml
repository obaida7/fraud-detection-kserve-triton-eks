name: Destroy Infrastructure & Teardown Compute

on:
  workflow_dispatch:
    inputs:
      destroy_scope:
        description: 'Teardown Scope'
        required: true
        default: 'full_infrastructure'
        type: choice
        options:
          - 'compute_and_serving'
          - 'full_infrastructure'

permissions:
  contents: read

jobs:
  teardown:
    name: Destroy Triton, EKS & Cloud Storage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Teardown Serving Layer & S3 Storage
      run: |
        if [ "${{ github.event.inputs.destroy_scope }}" = "compute_and_serving" ]; then
          python scripts/destroy_all.py --skip-terraform
        else
          python scripts/destroy_all.py
        fi

    - name: Setup Terraform (if full_infrastructure selected)
      if: ${{ github.event.inputs.destroy_scope == 'full_infrastructure' }}
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.8.0

    - name: Terraform Destroy
      if: ${{ github.event.inputs.destroy_scope == 'full_infrastructure' }}
      working-directory: ./terraform
      run: |
        terraform init -backend=false
        terraform destroy -auto-approve || true

    - name: Teardown Summary
      run: |
        echo "### 🗑️ Teardown & Cost Elimination Complete" >> $GITHUB_STEP_SUMMARY
        echo "* **Scope:** \`${{ github.event.inputs.destroy_scope }}\`" >> $GITHUB_STEP_SUMMARY
        echo "* **Status:** All serving workloads, ALB ingress, and compute resources successfully terminated." >> $GITHUB_STEP_SUMMARY
        echo "* **Active Cloud Charges:** **\$0.00**" >> $GITHUB_STEP_SUMMARY
