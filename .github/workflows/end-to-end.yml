name: Fraud Detection Triton & KServe CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  train_and_validate:
    name: Model Training, ONNX Export & Governance Gate
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -r scripts/requirements.txt

    - name: Generate Baseline Transactions
      run: |
        python scripts/generate_dataset.py --samples 25000 --output data/fraud_detection.csv

    - name: Train Deep Model & Export to Triton Model Repository
      run: |
        python scripts/train_and_export_triton.py \
          --data_path data/fraud_detection.csv \
          --model_repo model_repository \
          --model_name fraud_detection

    - name: Model Quality & Regulatory Governance Gate
      run: |
        python -c "
        import json, sys
        with open('artifacts/evaluation/evaluation.json') as f:
            eval_data = json.load(f)
        roc = eval_data['roc_auc']
        pr = eval_data['pr_auc']
        print(f'Governance Gate Check: ROC-AUC={roc:.4f}, PR-AUC={pr:.4f}')
        if not eval_data.get('quality_gate_passed', False):
            print('❌ Model failed banking risk governance gate!')
            sys.exit(1)
        print('✅ Model passed banking risk governance gate!')
        "

    - name: Upload Evaluation Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: model-governance-report
        path: |
          artifacts/evaluation/evaluation.json
          model_repository/fraud_detection/config.pbtxt

  terraform_validation:
    name: Infrastructure as Code (Terraform) Validation
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: 1.8.0

    - name: Terraform Format & Init
      run: |
        cd terraform
        terraform fmt -check
        terraform init -backend=false

    - name: Terraform Validate
      run: |
        cd terraform
        terraform validate

  incident_and_load_drills:
    name: Incident Drills & Autoscaling Simulation
    needs: [train_and_validate, terraform_validation]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r scripts/requirements.txt

    - name: Run Banking Incident Drills
      run: |
        python scripts/simulate_incidents.py
        echo "### 🛡️ Production Incident Drill Summary" >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
        cat artifacts/evaluation/incidents_report.json >> $GITHUB_STEP_SUMMARY
        echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
